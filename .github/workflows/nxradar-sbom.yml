# NxRadar SBOM — GitHub Actions (self-hosted runner on local WSL)
# Secrets: NXRADAR_API_KEY = service account nxr_* key
# Requires: upload-server :7007, nxsbom :6005, and a self-hosted runner online
name: NxRadar SBOM
on: [push]
jobs:
  sbom:
    runs-on: self-hosted
    env:
      NXRADAR_API_KEY: ${{ secrets.NXRADAR_API_KEY }}
      NXRADAR_ORG_ID: "72OO5R9SCO"
      NXRADAR_UPLOAD_URL: "http://127.0.0.1:7007"
      NXRADAR_API_URL: "http://127.0.0.1:6005"
      NXRADAR_PIPELINE_IDENTITY_ID: "6a954757ec90149ae7ba842b"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch nxsbom CLI
        run: |
          set -e
          mkdir -p bin
          curl -fSL -o bin/nxsbom "${NXRADAR_API_URL:-$NXRADAR_UPLOAD_URL}/api/v1/agents/download/cli-linux-x64"
          chmod +x bin/nxsbom
          ./bin/nxsbom --version
      - name: SBOM scan
        run: |
          set -e
          export PATH="$PWD/bin:$PATH"
          # --app-version — version strategy: Commit SHA.
          # Falls through to the next available source: a version that repeats is
          # refused by the per-version SBOM lock (HTTP 409) on the next build.
          COMMIT=$(printf '%s' "${GITHUB_SHA:-}" | cut -c1-7)
          APP_VERSION="${COMMIT:-build-${GITHUB_RUN_NUMBER:-0}}"
          IDEM=$(printf '%s' "nxsbom-${GITHUB_RUN_NUMBER:-0}-$APP_VERSION" | tr -c 'A-Za-z0-9_.:-' '-' | cut -c1-64)
          nxsbom cicd scan --path . \
            --app-version "$APP_VERSION" \
            --commit "${GITHUB_SHA:-}" \
            --branch "${GITHUB_REF_NAME:-main}" \
            --idempotency-key "$IDEM" \
            --format junit --output nxradar-sbom.xml \
            --format json  --output nxradar-decision.json
      - name: Upload NxRadar artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxradar-sbom
          path: |
            nxradar-sbom.xml
            nxradar-decision.json
          if-no-files-found: ignore
