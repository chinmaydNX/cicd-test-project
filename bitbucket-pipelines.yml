# Mirrors cicd-test-project/Jenkinsfile (CLI 1.0.1: generate-new + curl upload).
# Requires self-hosted runner on the same LAN as upload/CLI hosts.
image: atlassian/default-image:4

pipelines:
  default:
    - step:
        name: NxRadar — SBOM Scan
        runs-on:
          - self.hosted
          - linux
        script:
          - export NXRADAR_ORG_ID="${NXRADAR_ORG_ID:-72OO5R9SCO}"
          - export NXRADAR_UPLOAD_URL="${NXRADAR_UPLOAD_URL:-http://172.30.7.59:7007}"
          - export NXRADAR_CLI_URL="${NXRADAR_CLI_URL:-http://172.30.7.59:7099/nxsbom}"
          - export NXRADAR_CLIENT_ID="${NXRADAR_CLIENT_ID:-693bde842d84d0e636c80b89}"
          - export APP_NAME="${APP_NAME:-cicd-test-project}"
          - export GROUP_NAME="${GROUP_NAME:-jenkins-cicd-test}"
          - export SUPPLIER="${SUPPLIER:-Internal}"
          - export ENVIRONMENT="${ENVIRONMENT:-Dev}"
          - export CRITICALITY="${CRITICALITY:-Medium}"
          - export ENABLE_POLICY_GATE="${ENABLE_POLICY_GATE:-true}"
          - |
            set -e
            echo "DEBUG upload=$NXRADAR_UPLOAD_URL cli=$NXRADAR_CLI_URL"
            if [ -z "${NXRADAR_API_KEY:-}" ]; then
              echo "ERROR: NXRADAR_API_KEY is not set."
              echo "Add it under Repository settings → Repository variables (Secured)."
              echo "Use the same nxr_* key as Jenkins credential nxradar-api-key."
              exit 1
            fi
            echo "DEBUG NXRADAR_API_KEY is set (len=${#NXRADAR_API_KEY})"
          # Fetch CLI into /tmp (writable; mirrors Jenkins WORKSPACE_TMP)
          - |
            set -e
            TOOLS_DIR="/tmp/nxradar-cli-${BITBUCKET_BUILD_NUMBER}"
            mkdir -p "$TOOLS_DIR"
            echo "Fetching CLI from $NXRADAR_CLI_URL ..."
            curl -fSL -o "$TOOLS_DIR/nxsbom" "$NXRADAR_CLI_URL"
            chmod +x "$TOOLS_DIR/nxsbom"
            "$TOOLS_DIR/nxsbom" --version || "$TOOLS_DIR/nxsbom" --help | head -5
            echo "$TOOLS_DIR" > .nxradar-tools-dir
            export PATH="$TOOLS_DIR:$PATH"
          # Generate SBOM (CLI 1.0.1)
          - |
            set -e
            TOOLS_DIR=$(cat .nxradar-tools-dir)
            export PATH="$TOOLS_DIR:$PATH"
            rm -f ./syft ./nxsbom
            rm -rf ./bin
            ENC_KEY=$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | base64 -w0)
            export ENC_KEY
            python3 -c "import json,os; open('config.json','w').write(json.dumps({'orgId':os.environ['NXRADAR_ORG_ID'],'agentId':'agt_bitbucket_'+os.environ.get('BITBUCKET_REPO_SLUG','repo'),'keyId':'agt_bitbucket_'+os.environ.get('BITBUCKET_REPO_SLUG','repo')+'-k1','serverBaseUrl':os.environ['NXRADAR_UPLOAD_URL'],'encPublicKey':os.environ['ENC_KEY'],'defaultTool':'syft'}))"
            nxsbom generate-new \
              -t dir -p . \
              -n "$APP_NAME" \
              -v "${BITBUCKET_BUILD_NUMBER}" \
              -s "$SUPPLIER" \
              -r "$CRITICALITY" \
              -e "$ENVIRONMENT" \
              -c ./config.json \
              -o sbom.json
            echo "SBOM ready: $(wc -c < sbom.json) bytes"
          # Upload
          - |
            set -e
            HTTP_CODE=$(curl -sS -o /tmp/nxradar-upload.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $NXRADAR_API_KEY" \
              -H "x-org-id: $NXRADAR_ORG_ID" \
              -F "artifact=@sbom.json" \
              -F "clientId=$NXRADAR_CLIENT_ID" \
              -F "applicationName=$APP_NAME" \
              -F "applicationVersion=${BITBUCKET_BUILD_NUMBER}" \
              -F "groupName=$GROUP_NAME" \
              -F "supplier=$SUPPLIER" \
              -F "environment=$ENVIRONMENT" \
              -F "criticality=$CRITICALITY" \
              -F "ciSystem=bitbucket" \
              -F "branch=${BITBUCKET_BRANCH:-main}" \
              -F "commit=${BITBUCKET_COMMIT}" \
              -F "pipelineId=${BITBUCKET_PIPELINE_UUID}" \
              "$NXRADAR_UPLOAD_URL/api/v1/scans/upload")
            echo "HTTP $HTTP_CODE"
            cat /tmp/nxradar-upload.json
            echo
            test "$HTTP_CODE" = "200" -o "$HTTP_CODE" = "201" -o "$HTTP_CODE" = "202"
            SBOM_ID=$(grep -oE '"sbomId"[[:space:]]*:[[:space:]]*"[^"]+"|"scanId"[[:space:]]*:[[:space:]]*"[^"]+"' /tmp/nxradar-upload.json | head -1 | grep -oE '"[^"]+"$' | tr -d '"')
            echo "scanId=$SBOM_ID"
            test -n "$SBOM_ID"
            echo "$SBOM_ID" > scan_id.txt
            cp /tmp/nxradar-upload.json nxradar-upload-response.json
          # Wait for processing
          - |
            set -e
            SBOM_ID=$(cat scan_id.txt)
            echo "Polling status for $SBOM_ID ..."
            for i in $(seq 1 60); do
              CODE=$(curl -sS -o /tmp/nxradar-status.json -w "%{http_code}" \
                -H "Authorization: Bearer $NXRADAR_API_KEY" \
                -H "x-org-id: $NXRADAR_ORG_ID" \
                "$NXRADAR_UPLOAD_URL/api/v1/scans/$SBOM_ID/status" || echo 000)
              BODY=$(cat /tmp/nxradar-status.json 2>/dev/null || true)
              echo "poll $i status HTTP=$CODE body=$BODY"
              echo "$BODY" | grep -qE '"state"[[:space:]]*:[[:space:]]*"FAILED"' && echo "PROCESSING_FAILED" && exit 1
              echo "$BODY" | grep -qE '"state"[[:space:]]*:[[:space:]]*"COMPLETED"' && echo "PROCESSING_COMPLETE" && exit 0
              sleep 15
            done
            echo "Timed out waiting for SBOM processing"
            exit 1
          # Policy gate
          - |
            set -e
            if [ "$ENABLE_POLICY_GATE" != "true" ]; then
              echo "Policy gate disabled"
              exit 0
            fi
            SBOM_ID=$(cat scan_id.txt)
            echo "Polling policy decision for $SBOM_ID (fail-closed) ..."
            for i in $(seq 1 40); do
              CODE=$(curl -sS -o nxradar-decision.json -w "%{http_code}" \
                -H "Authorization: Bearer $NXRADAR_API_KEY" \
                -H "x-org-id: $NXRADAR_ORG_ID" \
                "$NXRADAR_UPLOAD_URL/api/v1/scans/$SBOM_ID/decision" || echo 000)
              BODY=$(cat nxradar-decision.json 2>/dev/null || true)
              echo "poll $i decision HTTP=$CODE body=$BODY"
              if echo "$BODY" | grep -qE '"compliant"[[:space:]]*:[[:space:]]*false'; then
                echo "POLICY_GATE_FAILED"
                exit 1
              fi
              if echo "$BODY" | grep -qE '"compliant"[[:space:]]*:[[:space:]]*true'; then
                echo "POLICY_GATE_OK"
                exit 0
              fi
              sleep 15
            done
            echo "POLICY_GATE_TIMEOUT — no compliant boolean after polling; failing build"
            exit 1
        artifacts:
          - sbom.json
          - scan_id.txt
          - nxradar-*.json
          - config.json
